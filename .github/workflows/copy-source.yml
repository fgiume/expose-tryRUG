name: Copy EXPOSE Try 5 files
on:
  push:
    paths:
      - '.github/workflows/copy-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone original read-only
        run: git clone --depth 1 https://github.com/fgiume/expose-try5.git /tmp/expose-original
      - name: Copy original files and preserve this workflow
        run: |
          rsync -a --exclude=.git --exclude='.github/workflows/' /tmp/expose-original/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy original EXPOSE Try 5 site and research data" || exit 0
          git push origin HEAD:main
